{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="text-center mb-4">Login</h3>
      
      <h5>Patient Login</h5>
      <form method="POST" action="/login">
        <input type="hidden" name="role" value="patient">
        <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      
      <hr class="my-4">
      
      <h5>Doctor Login</h5>
      <form method="POST" action="/login">
        <input type="hidden" name="role" value="doctor">
        <input type="text" name="username" class="form-control mb-2" value="doctor" readonly>
        <input type="password" name="password" class="form-control mb-3" value="health123" readonly>
        <button type="submit" class="btn btn-outline-primary w-100">Login as Doctor</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
