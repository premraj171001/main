<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Healthcheck{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="/">❤️ Healthcheck</a>
      <div class="navbar-nav ms-auto">
        {% if session.role == 'patient' %}
          <a class="nav-link" href="/patient/dashboard">Dashboard</a>
          <a class="nav-link" href="/logout">Logout</a>
        {% elif session.role == 'doctor' %}
          <a class="nav-link" href="/doctor/dashboard">Doctor Panel</a>
          <a class="nav-link" href="/logout">Logout</a>
        {% else %}
          <a class="nav-link" href="/auth/patient/login">Patient</a>
          <a class="nav-link" href="/auth/doctor/login">Doctor</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container mt-4">{% block content %}{% endblock %}</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
